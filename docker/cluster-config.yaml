apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: wiz-exercise-cluster
  region: eu-west-1
  version: "1.31"

vpc:
  nat:
    gateway: Single

managedNodeGroups:
  - name: wiz-workers
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 1
    maxSize: 3
    privateNetworking: true  # Nodes in private subnet
    iam:
      withAddonPolicies:
        albIngress: true
        cloudWatch: true
